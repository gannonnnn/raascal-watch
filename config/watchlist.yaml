version: 3

# RaaScal Watch begins with an identity match, then evaluates the surrounding
# contract for monitored metrics and explainable risk categories. A match is a
# candidate for review, not evidence that abuse or manipulation has occurred.
organizations:
  - name: Spotify
    enabled: true
    aliases:
      - Spotify
      - Spotify Technology
    products:
      - Spotify Wrapped
      - Spotify Charts
      - Spotify Premium
      - Spotify for Artists
    executives: []
    metrics:
      - stream
      - streams
      - monthly active users
      - MAU
      - subscribers
      - downloads
      - chart position
      - top 50
      - number one
    stakeholders:
      - Trust & Safety
      - Fraud
      - Data Science
      - Product Analytics
    playbook:
      - Compare the referenced metric with bot, device, account-age, geography, and traffic-source cohorts.
      - Flag affected product dashboards so leaders know the signal may be externally incentivized.

  - name: Cloudflare
    enabled: true
    aliases:
      - Cloudflare
      - Cloudflare Inc
    products:
      - Cloudflare Workers
      - Cloudflare Pages
      - Cloudflare Zero Trust
      - Cloudflare One
      - Cloudflare R2
      - Cloudflare WAF
      - Cloudflare Radar
      - 1.1.1.1
    executives: []
    metrics:
      - outage
      - critical incident
      - service disruption
      - downtime
      - availability
      - latency
      - degraded service
      - DDoS
      - denial of service
      - DNS outage
      - network incident
      - security incident
      - data breach
      - status page
    stakeholders:
      - Security Operations
      - Threat Intelligence
      - Site Reliability Engineering
      - Incident Response
      - Legal
    playbook:
      - Correlate market creation, odds movement, and settlement timing with service telemetry, DDoS signals, vulnerability reports, and threat-intelligence activity.
      - Preserve a snapshot of the contract and relevant security or availability logs without treating the market itself as proof of an attack.
      - Escalate unusual market activity near settlement to Security Operations and Site Reliability Engineering for a time-bound review.

  - name: FlightAware
    enabled: true
    aliases:
      - FlightAware
      - FlightAware LLC
    products:
      - FlightAware AeroAPI
      - AeroAPI
      - FlightAware Firehose
      - FlightAware Foresight
      - FlightAware Global
      - FlightAware MiseryMap
    executives: []
    metrics:
      - flight cancellation
      - flight cancellations
      - cancellation count
      - cancelled flights
      - canceled flights
      - cancellation rate
      - delayed flights
      - flight delays
      - diverted flights
      - airport closure
      - airport closures
      - scheduled flights
      - flight status
      - on-time performance
      - total cancellations
      - outcome verified from FlightAware
    stakeholders:
      - Legal
      - Data Licensing
      - Data Partnerships
      - Brand Protection
      - Product Integrity
      - Aviation Operations
    playbook:
      - Preserve the market rules and determine whether FlightAware is named as a primary, fallback, or verification source.
      - Confirm whether use of FlightAware data, APIs, links, names, or trademarks is authorized under applicable licenses and terms.
      - Assess whether the contract creates incentives to disrupt flights, airports, carrier operations, or data availability.
      - Review unusual scraping or API traffic around settlement without treating the market itself as evidence of abuse.

  - name: YouTube
    enabled: true
    aliases:
      - YouTube
      - YouTube.com
    products:
      - YouTube Shorts
      - YouTube Music
      - YouTube Premium
      - YouTube Live
      - YouTube Trending
      - YouTube TV
    executives: []
    metrics:
      - video views
      - views
      - view count
      - views in first week
      - watch time
      - subscribers
      - subscriber count
      - likes
      - comments
      - concurrent viewers
      - trending
      - trending position
      - upload date
      - upload time
      - livestream
      - number one
    stakeholders:
      - Trust & Safety
      - Abuse Prevention
      - Creator Integrity
      - Product Analytics
      - Security
    playbook:
      - Compare the referenced engagement with account-age, device, geography, referral-source, paid-promotion, and retention cohorts.
      - Determine whether the resolution source is a public YouTube counter, chart, or enforcement decision that could be directly influenced.
      - Separate creator-controlled behavior from platform abuse before changing detection models or product decisions.

  - name: MrBeast / Beast Industries
    enabled: true
    aliases:
      - MrBeast
      - Mr Beast
      - Jimmy Donaldson
      - Beast Industries
    products:
      - Beast Games
      - Feastables
      - Beast Philanthropy
    executives: []
    metrics:
      - video views
      - views in first week
      - subscriber count
      - upload date
      - upload time
      - next video
      - next YouTube video
      - video title
      - words spoken
      - will say
      - will mention
      - episode release
      - product launch
    stakeholders:
      - Creator Operations
      - Legal
      - Compliance
      - Insider Risk
      - Security
      - Analytics
    playbook:
      - Identify employees, production partners, agencies, sponsors, or vendors with advance access to scripts, upload timing, titles, or release plans.
      - Distinguish outcomes the creator can directly control from outcomes requiring coordinated audience or platform manipulation.
      - Review unusual engagement separately from paid promotion and preserve the relevant production and analytics timeline.

  - name: OpenAI / ChatGPT
    enabled: true
    aliases:
      - OpenAI
      - ChatGPT
    products:
      - GPT-6
      - GPT-5.6
      - ChatGPT Plus
      - ChatGPT Pro
      - OpenAI API
      - OpenAI Sora
      - DALL-E
    executives: []
    metrics:
      - release date
      - launch date
      - model release
      - frontier model
      - outage
      - outage days
      - downtime
      - status page
      - benchmark
      - leaderboard
      - arena score
      - model ranking
      - best AI model
      - top AI model
      - subscription price
      - ChatGPT price
      - API price
      - token price
      - app store ranking
      - valuation
      - IPO
    stakeholders:
      - Insider Risk
      - Legal & Compliance
      - Product Security
      - Site Reliability Engineering
      - AI Evaluation
      - Communications
      - Finance
    playbook:
      - Classify the contract as a direct-control or advance-knowledge event, an availability event, an external benchmark, or a financial-reporting outcome.
      - Identify employees, contractors, evaluation partners, cloud providers, and launch partners with advance access to the relevant answer.
      - Compare market creation and odds movement with deployment, status, benchmark, pricing, and announcement timelines.
      - Preserve the contract and supporting telemetry without treating a prediction or position as evidence of misconduct.

  # Copy this block and set enabled: true for a client or another research profile.
  - name: Example Company
    enabled: false
    aliases:
      - Example Company
      - ExampleCo
    products:
      - Example App
    executives:
      - Example CEO
    metrics:
      - daily active users
      - payment volume
      - app store ranking
    stakeholders:
      - Risk
      - Security
    playbook:
      - Open an internal incident record and assign a named owner.

# Each category contributes its weight once when any configured term appears in
# the contract title or rules. Categories only score after an organization or
# product identity has matched.
risk_categories:
  popularity_and_ranking:
    weight: 20
    terms:
      - rank
      - ranking
      - chart
      - top 10
      - top 50
      - number one
      - most popular
      - trending
      - bestseller
      - award
      - win an award
    stakeholders:
      - Product Analytics
      - Trust & Safety
    actions:
      - Review ranking, recommendation, and discovery systems for coordinated activity.

  engagement_manipulation:
    weight: 25
    terms:
      - stream
      - streams
      - views
      - video views
      - view count
      - watch time
      - likes
      - comments
      - shares
      - downloads
      - installs
      - votes
      - ratings
      - reviews
      - listens
      - followers
      - subscribers
      - subscriber count
      - impressions
      - concurrent viewers
    stakeholders:
      - Fraud
      - Trust & Safety
      - Data Science
    actions:
      - Increase monitoring for automation, new-account velocity, repeated devices, concentrated traffic sources, and low-retention engagement.

  availability_and_incident:
    weight: 28
    terms:
      - outage
      - critical incident
      - service disruption
      - downtime
      - offline
      - unavailable
      - degraded service
      - service degradation
      - latency
      - DDoS
      - denial of service
      - cyberattack
      - security incident
      - network incident
      - data breach
      - DNS outage
      - status page
      - airport closure
      - airport closures
      - flight cancellation
      - flight cancellations
    stakeholders:
      - Security Operations
      - Site Reliability Engineering
      - Incident Response
      - Threat Intelligence
    actions:
      - Compare market timing and movement with availability telemetry, security alerts, operational disruptions, vulnerability disclosures, and incident-response activity.

  oracle_and_data_dependency:
    weight: 22
    terms:
      - outcome verified from
      - verified from
      - primary source agency
      - resolution source
      - source agency
      - data source
      - official data
      - official dashboard
      - public counter
      - public view count
      - public subscriber count
      - Cloudflare Radar
      - status page
    stakeholders:
      - Legal
      - Data Governance
      - Data Licensing
      - Data Partnerships
      - Brand Protection
    actions:
      - Preserve the exact settlement language and identify the organization whose data, counter, status page, or trademark determines the payout.
      - Confirm whether the data and brand use is authorized and whether reliance creates operational, contractual, reputational, or safety exposure.

  benchmark_and_evaluation_integrity:
    weight: 22
    terms:
      - benchmark
      - leaderboard
      - arena score
      - LM Arena
      - LMArena
      - best AI model
      - top AI model
      - coding arena
      - text arena
      - model ranking
      - evaluation score
      - eval score
    stakeholders:
      - AI Evaluation
      - Model Integrity
      - Product Security
      - Research Operations
    actions:
      - Compare the market's resolution benchmark with controlled evaluations and review whether submissions, voting, contamination, or disclosure timing could affect the result.

  direct_control_and_advance_knowledge:
    weight: 22
    terms:
      - will say
      - will mention
      - next video
      - next YouTube video
      - upload date
      - upload time
      - video title
      - publish a video
      - release a video
      - livestream
      - script
      - prepared remarks
      - announcement timing
      - episode release
      - release date
      - launch date
      - model release
      - frontier model
    stakeholders:
      - Legal
      - Compliance
      - Insider Risk
      - Creator Operations
    actions:
      - Identify people with direct control of, or advance access to, the outcome and review relevant employee, contractor, and vendor obligations.

  platform_action:
    weight: 20
    terms:
      - ban
      - banned
      - suspend
      - suspended
      - remove
      - removed
      - reinstate
      - deplatform
      - approve
      - verify
      - list
      - delist
      - launch
      - release
      - feature
      - featured
      - price increase
      - increase the cost
    stakeholders:
      - Legal
      - Communications
      - Trust & Safety
    actions:
      - Check whether reports, complaints, policy-enforcement queues, publication timing, pricing, or launch decisions could be gamed before settlement.

  user_growth:
    weight: 18
    terms:
      - daily active users
      - DAU
      - monthly active users
      - MAU
      - subscribers
      - subscriber count
      - signups
      - registrations
      - active users
      - user growth
    stakeholders:
      - Growth
      - Product Analytics
      - Finance
    actions:
      - Separate durable customer growth from paid, bot, duplicate, coordinated, or low-retention cohorts.

  financial_metric:
    weight: 15
    terms:
      - revenue
      - sales
      - GMV
      - gross merchandise value
      - payment volume
      - transaction volume
      - valuation
      - market share
      - earnings
      - IPO
      - subscription price
      - API price
      - token price
    stakeholders:
      - Finance
      - Legal
      - Investor Relations
    actions:
      - Reconcile the referenced measure to controlled finance data before internal or external reporting.

  explicit_abuse_language:
    weight: 30
    terms:
      - bot
      - bots
      - view bot
      - view bots
      - subscriber bot
      - fake accounts
      - fake streams
      - artificial traffic
      - click farm
      - traffic farm
      - manipulate
      - manipulation
      - stream farm
      - coordinated campaign
      - coordinated viewing
      - brigading
      - astroturf
      - DDoS
      - denial of service
      - disrupt flights
      - cause cancellations
    stakeholders:
      - Fraud
      - Security
      - Legal
    actions:
      - Escalate for immediate abuse review and preserve relevant logs under the incident-retention policy.
