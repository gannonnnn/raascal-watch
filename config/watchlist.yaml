version: 2

# RaaScal Watch begins with an identity match, then evaluates the surrounding
# contract for monitored metrics and explainable risk categories. A match is a
# candidate for review, not evidence that abuse or manipulation has occurred.
organizations:
  - name: Spotify
    enabled: true
    aliases:
      - Spotify
      - Spotify Technology
    products:
      - Spotify Wrapped
      - Spotify Charts
      - Spotify Premium
      - Spotify for Artists
    executives: []
    metrics:
      - stream
      - streams
      - monthly active users
      - MAU
      - subscribers
      - downloads
      - chart position
      - top 50
      - number one
    stakeholders:
      - Trust & Safety
      - Fraud
      - Data Science
      - Product Analytics
    playbook:
      - Compare the referenced metric with bot, device, account-age, geography, and traffic-source cohorts.
      - Flag affected product dashboards so leaders know the signal may be externally incentivized.

  - name: Cloudflare
    enabled: true
    aliases:
      - Cloudflare
      - Cloudflare Inc
    products:
      - Cloudflare Workers
      - Cloudflare Pages
      - Cloudflare Zero Trust
      - Cloudflare One
      - Cloudflare R2
      - Cloudflare WAF
      - Cloudflare Radar
      - 1.1.1.1
    executives: []
    metrics:
      - outage
      - critical incident
      - service disruption
      - downtime
      - availability
      - latency
      - degraded service
      - DDoS
      - denial of service
      - DNS outage
      - network incident
      - security incident
      - data breach
      - status page
    stakeholders:
      - Security Operations
      - Threat Intelligence
      - Site Reliability Engineering
      - Incident Response
      - Legal
    playbook:
      - Correlate market creation, odds movement, and settlement timing with service telemetry, DDoS signals, vulnerability reports, and threat-intelligence activity.
      - Preserve a snapshot of the contract and relevant security or availability logs without treating the market itself as proof of an attack.
      - Escalate unusual market activity near settlement to Security Operations and Site Reliability Engineering for a time-bound review.

  - name: YouTube
    enabled: true
    aliases:
      - YouTube
      - YouTube.com
    products:
      - YouTube Shorts
      - YouTube Music
      - YouTube Premium
      - YouTube Live
      - YouTube Trending
      - YouTube TV
    executives: []
    metrics:
      - video views
      - views
      - view count
      - views in first week
      - watch time
      - subscribers
      - subscriber count
      - likes
      - comments
      - concurrent viewers
      - trending
      - trending position
      - upload date
      - upload time
      - livestream
      - number one
    stakeholders:
      - Trust & Safety
      - Abuse Prevention
      - Creator Integrity
      - Product Analytics
      - Security
    playbook:
      - Compare the referenced engagement with account-age, device, geography, referral-source, paid-promotion, and retention cohorts.
      - Determine whether the resolution source is a public YouTube counter, chart, or enforcement decision that could be directly influenced.
      - Separate creator-controlled behavior from platform abuse before changing detection models or product decisions.

  - name: MrBeast / Beast Industries
    enabled: true
    aliases:
      - MrBeast
      - Mr Beast
      - Jimmy Donaldson
      - Beast Industries
    products:
      - Beast Games
      - Feastables
      - Beast Philanthropy
    executives: []
    metrics:
      - video views
      - views in first week
      - subscriber count
      - upload date
      - upload time
      - next video
      - next YouTube video
      - video title
      - words spoken
      - will say
      - will mention
      - episode release
      - product launch
    stakeholders:
      - Creator Operations
      - Legal
      - Compliance
      - Insider Risk
      - Security
      - Analytics
    playbook:
      - Identify employees, production partners, agencies, sponsors, or vendors with advance access to scripts, upload timing, titles, or release plans.
      - Distinguish outcomes the creator can directly control from outcomes requiring coordinated audience or platform manipulation.
      - Review unusual engagement separately from paid promotion and preserve the relevant production and analytics timeline.

  # Copy this block and set enabled: true for a client or another research profile.
  - name: Example Company
    enabled: false
    aliases:
      - Example Company
      - ExampleCo
    products:
      - Example App
    executives:
      - Example CEO
    metrics:
      - daily active users
      - payment volume
      - app store ranking
    stakeholders:
      - Risk
      - Security
    playbook:
      - Open an internal incident record and assign a named owner.

# Each category contributes its weight once when any configured term appears in
# the contract title or rules. Categories only score after an organization or
# product identity has matched.
risk_categories:
  popularity_and_ranking:
    weight: 20
    terms:
      - rank
      - ranking
      - chart
      - top 10
      - top 50
      - number one
      - most popular
      - trending
      - bestseller
      - award
      - win an award
    stakeholders:
      - Product Analytics
      - Trust & Safety
    actions:
      - Review ranking, recommendation, and discovery systems for coordinated activity.

  engagement_manipulation:
    weight: 25
    terms:
      - stream
      - streams
      - views
      - video views
      - view count
      - watch time
      - likes
      - comments
      - shares
      - downloads
      - installs
      - votes
      - ratings
      - reviews
      - listens
      - followers
      - subscribers
      - subscriber count
      - impressions
      - concurrent viewers
    stakeholders:
      - Fraud
      - Trust & Safety
      - Data Science
    actions:
      - Increase monitoring for automation, new-account velocity, repeated devices, concentrated traffic sources, and low-retention engagement.

  availability_and_incident:
    weight: 28
    terms:
      - outage
      - critical incident
      - service disruption
      - downtime
      - offline
      - unavailable
      - degraded service
      - service degradation
      - latency
      - DDoS
      - denial of service
      - cyberattack
      - security incident
      - network incident
      - data breach
      - DNS outage
      - status page
    stakeholders:
      - Security Operations
      - Site Reliability Engineering
      - Incident Response
      - Threat Intelligence
    actions:
      - Compare market timing and movement with availability telemetry, security alerts, vulnerability disclosures, and incident-response activity.

  direct_control_and_advance_knowledge:
    weight: 22
    terms:
      - will say
      - will mention
      - next video
      - next YouTube video
      - upload date
      - upload time
      - video title
      - publish a video
      - release a video
      - livestream
      - script
      - prepared remarks
      - announcement timing
      - episode release
    stakeholders:
      - Legal
      - Compliance
      - Insider Risk
      - Creator Operations
    actions:
      - Identify people with direct control of, or advance access to, the outcome and review relevant employee, contractor, and vendor obligations.

  platform_action:
    weight: 20
    terms:
      - ban
      - banned
      - suspend
      - suspended
      - remove
      - removed
      - reinstate
      - deplatform
      - approve
      - verify
      - list
      - delist
      - launch
      - release
      - feature
      - featured
    stakeholders:
      - Legal
      - Communications
      - Trust & Safety
    actions:
      - Check whether reports, complaints, policy-enforcement queues, publication timing, or launch decisions could be gamed before settlement.

  user_growth:
    weight: 18
    terms:
      - daily active users
      - DAU
      - monthly active users
      - MAU
      - subscribers
      - subscriber count
      - signups
      - registrations
      - active users
      - user growth
    stakeholders:
      - Growth
      - Product Analytics
      - Finance
    actions:
      - Separate durable customer growth from paid, bot, duplicate, coordinated, or low-retention cohorts.

  financial_metric:
    weight: 15
    terms:
      - revenue
      - sales
      - GMV
      - gross merchandise value
      - payment volume
      - transaction volume
      - valuation
      - market share
      - earnings
    stakeholders:
      - Finance
      - Legal
      - Investor Relations
    actions:
      - Reconcile the referenced measure to controlled finance data before internal or external reporting.

  explicit_abuse_language:
    weight: 30
    terms:
      - bot
      - bots
      - view bot
      - view bots
      - subscriber bot
      - fake accounts
      - fake streams
      - artificial traffic
      - click farm
      - traffic farm
      - manipulate
      - manipulation
      - stream farm
      - coordinated campaign
      - coordinated viewing
      - brigading
      - astroturf
      - DDoS
      - denial of service
    stakeholders:
      - Fraud
      - Security
      - Legal
    actions:
      - Escalate for immediate abuse review and preserve relevant logs under the incident-retention policy.
