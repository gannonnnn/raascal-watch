[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raascal-watch"
version = "0.2.0"
description = "External incentive intelligence for public prediction markets"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Karissa Gannon" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
raascal-watch = "raascal_watch.cli:main"

[tool.setuptools.packages.find]
include = ["raascal_watch*"]

[tool.setuptools.package-data]
raascal_watch = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
